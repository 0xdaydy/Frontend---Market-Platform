<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marché Connect · Caisse</title>
  <style>
    :root {
      --bg:      #FAFAFA;
      --surface: #FFFFFF;
      --fg:      #212121;
      --muted:   #616161;
      --border:  #C4C7C5;
      --accent:  #00695C;
      --accent-warm: #E65100;
      --success: #2E7D32;
      --warning: #F9A825;

      --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
      --fg-soft:     color-mix(in oklch, var(--fg) 6%, transparent);

      --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Roboto', system-ui, sans-serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Roboto', system-ui, sans-serif;
      --font-mono:    ui-monospace, 'SF Mono', Menlo, 'Roboto Mono', monospace;

      --fs-h1: 26px;
      --fs-h2: 20px;
      --fs-h3: 16px;
      --fs-body: 15px;
      --fs-meta: 12px;

      --radius-card: 18px;
      --radius-pill: 999px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background:
        radial-gradient(60% 80% at 50% 0%, color-mix(in oklch, var(--accent) 6%, var(--bg)) 0%, var(--bg) 60%);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--fs-body);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .caption {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .caption strong { color: var(--fg); font-weight: 500; }

    .device {
      position: relative;
      width: 390px;
      height: 844px;
      border-radius: 56px;
      padding: 12px;
      background:
        linear-gradient(160deg, #2a2a2c 0%, #1a1a1c 50%, #0e0e10 100%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 0 0 2px #000 inset,
        0 28px 60px -12px rgba(0,0,0,0.45),
        0 8px 20px -8px rgba(0,0,0,0.35);
      isolation: isolate;
    }
    .device::before, .device::after {
      content: '';
      position: absolute;
      width: 3px;
      background: linear-gradient(to bottom, transparent 0%, rgba(255,255,255,0.06) 8%, transparent 16%, transparent 84%, rgba(255,255,255,0.04) 92%, transparent 100%);
      top: 100px;
      bottom: 100px;
      pointer-events: none;
    }
    .device::before { left: -1px; }
    .device::after  { right: -1px; }

    .island {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: 124px;
      height: 36px;
      background: #000;
      border-radius: 999px;
      z-index: 5;
    }

    .btn-rail {
      position: absolute;
      width: 4px;
      background: #0a0a0c;
      border-radius: 2px;
    }
    .btn-rail.left-1  { left: -3px; top: 174px; height: 32px; }
    .btn-rail.left-2  { left: -3px; top: 220px; height: 60px; }
    .btn-rail.left-3  { left: -3px; top: 290px; height: 60px; }
    .btn-rail.right-1 { right: -3px; top: 250px; height: 100px; }

    .screen {
      position: relative;
      width: 100%; height: 100%;
      background: var(--bg);
      border-radius: 44px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .statusbar {
      flex: 0 0 47px;
      padding: 18px 26px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 600;
      color: var(--fg);
      letter-spacing: -0.01em;
    }
    .statusbar .right { display: inline-flex; align-items: center; gap: 6px; }
    .statusbar svg { width: 17px; height: 11px; fill: var(--fg); }
    .statusbar .battery { width: 25px; }

    .content {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 8px 0 28px;
    }
    .content::-webkit-scrollbar { display: none; }

    .home-indicator {
      flex: 0 0 28px;
      position: relative;
    }
    .home-indicator::after {
      content: '';
      position: absolute;
      left: 50%; bottom: 8px;
      transform: translateX(-50%);
      width: 134px; height: 5px;
      background: var(--fg);
      border-radius: 999px;
      opacity: 0.85;
    }

    .pad     { padding-inline: 20px; }
    .stack   { display: flex; flex-direction: column; gap: 16px; }
    .row     { display: flex; align-items: center; gap: 12px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

    .header {
      padding: 8px 20px 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .header h1 {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin: 0;
    }
    .header .icon-btn {
      width: 36px; height: 36px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid; place-items: center;
      color: var(--fg);
      cursor: pointer;
    }
    .header .icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; }

    .greeting {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 4px;
    }

    .h2  { font-family: var(--font-display); font-size: var(--fs-h2); letter-spacing: -0.015em; line-height: 1.2; margin: 0; }
    .h3  { font-size: var(--fs-h3); font-weight: 600; line-height: 1.3; margin: 0; }
    .meta { font-family: var(--font-mono); font-size: var(--fs-meta); color: var(--muted); }
    .num  { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 16px;
    }
    .card.flat {
      background: transparent;
      border: 0;
      padding: 12px 0;
      border-top: 1px solid var(--border);
      border-radius: 0;
    }
    .card.flat:first-child { border-top: 0; padding-top: 0; }

    .avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background:
        linear-gradient(135deg, var(--accent-soft), var(--fg-soft)),
        var(--surface);
      border: 1px solid var(--border);
      display: grid; place-items: center;
      font-size: 13px; font-weight: 700; color: var(--accent);
      flex-shrink: 0;
    }

    .btn-primary {
      display: flex; align-items: center; justify-content: center;
      width: 100%;
      min-height: 48px;
      padding: 14px 20px;
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 14px;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.005em;
      cursor: pointer;
    }

    .pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--success);
      flex-shrink: 0;
    }

    .total-accent {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--accent);
    }

    /* Segmented control */
    .segmented {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }
    .segmented-btn {
      flex: 1;
      height: 44px;
      border: none;
      border-radius: 10px;
      background: transparent;
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
    }
    .segmented-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .warning-inline {
      font-size: 13px;
      color: var(--error);
      background: color-mix(in oklch, var(--error) 8%, transparent);
      padding: 10px 14px;
      border-radius: 10px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="caption"><strong>Marché Connect</strong> · Caisse</div>

    <div class="device" data-od-id="device">
      <span class="btn-rail left-1"  aria-hidden></span>
      <span class="btn-rail left-2"  aria-hidden></span>
      <span class="btn-rail left-3"  aria-hidden></span>
      <span class="btn-rail right-1" aria-hidden></span>
      <span class="island"           aria-hidden></span>

      <div class="screen">
        <!-- Status bar -->
        <div class="statusbar">
          <span class="num">9:41</span>
          <span class="right">
            <svg viewBox="0 0 17 11" aria-hidden>
              <rect x="0"  y="7" width="3" height="4" rx="0.6"/>
              <rect x="4"  y="5" width="3" height="6" rx="0.6"/>
              <rect x="8"  y="3" width="3" height="8" rx="0.6"/>
              <rect x="12" y="0" width="3" height="11" rx="0.6"/>
            </svg>
            <svg viewBox="0 0 17 11" aria-hidden>
              <path d="M8.5 1.5C5.5 1.5 2.7 2.6 0.5 4.6L2 6.1C3.8 4.5 6.1 3.6 8.5 3.6c2.4 0 4.7 0.9 6.5 2.5l1.5-1.5c-2.2-2-5-3.1-8-3.1zM3.5 7.6L5 9.1c1-0.9 2.2-1.4 3.5-1.4 1.3 0 2.5 0.5 3.5 1.4l1.5-1.5c-1.4-1.3-3.1-2-5-2-1.9 0-3.6 0.7-5 2zM6.5 10.6l2 2 2-2c-0.5-0.5-1.2-0.8-2-0.8s-1.5 0.3-2 0.8z"/>
            </svg>
            <svg class="battery" viewBox="0 0 25 11" aria-hidden>
              <rect x="0.5" y="0.5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity="0.45"/>
              <rect x="22" y="3.5" width="1.5" height="4" rx="0.4" fill="currentColor" fill-opacity="0.45"/>
              <rect x="2" y="2" width="18" height="7" rx="1.4"/>
            </svg>
          </span>
        </div>

        <!-- Content -->
        <main class="content" data-od-id="content">
          <div class="header" data-od-id="header">
            <div>
              <p class="greeting">Jeudi · 1er mai 2026</p>
              <h1>Caisse</h1>
            </div>
            <button class="icon-btn" aria-label="Paramètres">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
            </button>
          </div>

          <!-- Farmer card -->
          <section class="pad" data-od-id="farmer" style="margin-bottom: 8px;">
            <div class="card row" style="gap: 12px; align-items: center; padding: 14px 16px;">
              <div class="avatar" style="width: 44px; height: 44px; flex-shrink: 0;">KJ</div>
              <div style="flex: 1; min-width: 0;">
                <div style="font-size: 15px; font-weight: 500; line-height: 1.25;">Kouassi Jean</div>
                <div style="color: var(--muted); font-size: 13px; line-height: 1.3; margin-top: 2px;">Carte FM-2847 · +225 07 12 34 56</div>
              </div>
              <span class="pill">3 articles</span>
            </div>
          </section>

          <!-- Payment method -->
          <section class="pad" data-od-id="payment-method" style="margin-bottom: 8px;">
            <label style="font-size: 13px; font-weight: 500; color: var(--muted); display: block; margin-bottom: 6px;">Mode de paiement</label>
            <div class="segmented">
              <button class="segmented-btn active">Cash</button>
              <button class="segmented-btn">Crédit</button>
            </div>
          </section>

          <!-- Cart items -->
          <section class="pad stack" data-od-id="cart" style="gap: 0;">
            <div class="card flat row-between" style="padding: 14px 0;">
              <div>
                <div style="font-size: 15px; font-weight: 500;">Bananes plantain</div>
                <div style="color: var(--muted); font-size: 13px; margin-top: 2px;">2 × <span class="num">350</span> FCFA</div>
              </div>
              <span class="num" style="font-size: 16px; font-weight: 600;">700 FCFA</span>
            </div>
            <div class="card flat row-between" style="padding: 14px 0;">
              <div>
                <div style="font-size: 15px; font-weight: 500;">Igname</div>
                <div style="color: var(--muted); font-size: 13px; margin-top: 2px;">5 × <span class="num">200</span> FCFA</div>
              </div>
              <span class="num" style="font-size: 16px; font-weight: 600;">1 000 FCFA</span>
            </div>
            <div class="card flat row-between" style="padding: 14px 0;">
              <div>
                <div style="font-size: 15px; font-weight: 500;">Huile de palme</div>
                <div style="color: var(--muted); font-size: 13px; margin-top: 2px;">1 × <span class="num">1 500</span> FCFA</div>
              </div>
              <span class="num" style="font-size: 16px; font-weight: 600;">1 500 FCFA</span>
            </div>
          </section>

          <!-- Totals -->
          <section class="pad" data-od-id="totals" style="margin-top: 8px;">
            <div class="card" style="padding: 18px;">
              <div class="row-between" style="margin-bottom: 10px;">
                <span style="color: var(--muted); font-size: 14px;">Sous-total</span>
                <span class="num" style="font-size: 15px;">3 200 FCFA</span>
              </div>
              <div class="row-between" style="padding-top: 12px; border-top: 1px solid var(--border);">
                <span style="font-weight: 600; font-size: 16px;">Total</span>
                <span class="num total-accent">3 200 FCFA</span>
              </div>
            </div>
          </section>

          <!-- CTA -->
          <section class="pad" style="padding-top: 16px; padding-bottom: 12px;" data-od-id="cta">
            <button class="btn-primary">Finaliser la vente</button>
            <div class="row" style="justify-content: center; gap: 6px; margin-top: 12px;">
              <span class="status-dot"></span>
              <p class="meta" style="margin: 0;">En ligne — synchronisé</p>
            </div>
          </section>
        </main>

        <!-- No tab bar for checkout screen -->
        <div class="home-indicator" aria-hidden></div>
      </div>
    </div>
  </div>
</body>
</html>
