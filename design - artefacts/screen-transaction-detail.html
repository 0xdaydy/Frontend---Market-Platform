<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marché Connect · Transaction</title>
  <style>
    :root {
      --bg:      #FAFAFA;
      --surface: #FFFFFF;
      --fg:      #212121;
      --muted:   #616161;
      --border:  #C4C7C5;
      --accent:  #00695C;
      --accent-warm: #E65100;
      --success: #2E7D32;
      --warning: #F9A825;
      --error:   #B3261E;

      --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
      --fg-soft:     color-mix(in oklch, var(--fg) 6%, transparent);
      --success-soft: color-mix(in oklch, var(--success) 14%, transparent);

      --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Roboto', system-ui, sans-serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Roboto', system-ui, sans-serif;
      --font-mono:    ui-monospace, 'SF Mono', Menlo, 'Roboto Mono', monospace;

      --fs-h1: 26px;
      --fs-h2: 20px;
      --fs-h3: 16px;
      --fs-body: 15px;
      --fs-meta: 12px;

      --radius-card: 18px;
      --radius-pill: 999px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background:
        radial-gradient(60% 80% at 50% 0%, color-mix(in oklch, var(--accent) 6%, var(--bg)) 0%, var(--bg) 60%);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--fs-body);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .caption {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .caption strong { color: var(--fg); font-weight: 500; }

    .device {
      position: relative;
      width: 390px;
      height: 844px;
      border-radius: 56px;
      padding: 12px;
      background:
        linear-gradient(160deg, #2a2a2c 0%, #1a1a1c 50%, #0e0e10 100%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 0 0 2px #000 inset,
        0 28px 60px -12px rgba(0,0,0,0.45),
        0 8px 20px -8px rgba(0,0,0,0.35);
      isolation: isolate;
    }
    .device::before, .device::after {
      content: '';
      position: absolute;
      width: 3px;
      background: linear-gradient(to bottom, transparent 0%, rgba(255,255,255,0.06) 8%, transparent 16%, transparent 84%, rgba(255,255,255,0.04) 92%, transparent 100%);
      top: 100px;
      bottom: 100px;
      pointer-events: none;
    }
    .device::before { left: -1px; }
    .device::after  { right: -1px; }

    .island {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: 124px;
      height: 36px;
      background: #000;
      border-radius: 999px;
      z-index: 5;
    }

    .btn-rail {
      position: absolute;
      width: 4px;
      background: #0a0a0c;
      border-radius: 2px;
    }
    .btn-rail.left-1  { left: -3px; top: 174px; height: 32px; }
    .btn-rail.left-2  { left: -3px; top: 220px; height: 60px; }
    .btn-rail.left-3  { left: -3px; top: 290px; height: 60px; }
    .btn-rail.right-1 { right: -3px; top: 250px; height: 100px; }

    .screen {
      position: relative;
      width: 100%; height: 100%;
      background: var(--bg);
      border-radius: 44px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .statusbar {
      flex: 0 0 47px;
      padding: 18px 26px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 600;
      color: var(--fg);
      letter-spacing: -0.01em;
    }
    .statusbar .right { display: inline-flex; align-items: center; gap: 6px; }
    .statusbar svg { width: 17px; height: 11px; fill: var(--fg); }
    .statusbar .battery { width: 25px; }

    .content {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 8px 0 28px;
    }
    .content::-webkit-scrollbar { display: none; }

    .home-indicator {
      flex: 0 0 28px;
      position: relative;
    }
    .home-indicator::after {
      content: '';
      position: absolute;
      left: 50%; bottom: 8px;
      transform: translateX(-50%);
      width: 134px; height: 5px;
      background: var(--fg);
      border-radius: 999px;
      opacity: 0.85;
    }

    .pad     { padding-inline: 20px; }
    .stack   { display: flex; flex-direction: column; gap: 16px; }
    .row     { display: flex; align-items: center; gap: 12px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

    .header {
      padding: 8px 20px 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .header h1 {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin: 0;
    }
    .header .icon-btn {
      width: 36px; height: 36px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid; place-items: center;
      color: var(--fg);
      cursor: pointer;
    }
    .header .icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; }

    .greeting {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 4px;
    }

    .h2  { font-family: var(--font-display); font-size: var(--fs-h2); letter-spacing: -0.015em; line-height: 1.2; margin: 0; }
    .h3  { font-size: var(--fs-h3); font-weight: 600; line-height: 1.3; margin: 0; }
    .meta { font-family: var(--font-mono); font-size: var(--fs-meta); color: var(--muted); }
    .num  { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 16px;
    }
    .card.flat {
      background: transparent;
      border: 0;
      padding: 12px 0;
      border-top: 1px solid var(--border);
      border-radius: 0;
    }
    .card.flat:first-child { border-top: 0; padding-top: 0; }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .status-chip.synced { background: var(--success-soft); color: var(--success); }
    .status-chip.cash { background: var(--success-soft); color: var(--success); }
    .status-chip.credit { background: var(--accent-warm-soft); color: var(--accent-warm); }

    .total-accent {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="caption"><strong>Marché Connect</strong> · Transaction</div>

    <div class="device" data-od-id="device">
      <span class="btn-rail left-1"  aria-hidden></span>
      <span class="btn-rail left-2"  aria-hidden></span>
      <span class="btn-rail left-3"  aria-hidden></span>
      <span class="btn-rail right-1" aria-hidden></span>
      <span class="island"           aria-hidden></span>

      <div class="screen">
        <!-- Status bar -->
        <div class="statusbar">
          <span class="num">9:41</span>
          <span class="right">
            <svg viewBox="0 0 17 11" aria-hidden>
              <rect x="0"  y="7" width="3" height="4" rx="0.6"/>
              <rect x="4"  y="5" width="3" height="6" rx="0.6"/>
              <rect x="8"  y="3" width="3" height="8" rx="0.6"/>
              <rect x="12" y="0" width="3" height="11" rx="0.6"/>
            </svg>
            <svg viewBox="0 0 17 11" aria-hidden>
              <path d="M8.5 1.5C5.5 1.5 2.7 2.6 0.5 4.6L2 6.1C3.8 4.5 6.1 3.6 8.5 3.6c2.4 0 4.7 0.9 6.5 2.5l1.5-1.5c-2.2-2-5-3.1-8-3.1zM3.5 7.6L5 9.1c1-0.9 2.2-1.4 3.5-1.4 1.3 0 2.5 0.5 3.5 1.4l1.5-1.5c-1.4-1.3-3.1-2-5-2-1.9 0-3.6 0.7-5 2zM6.5 10.6l2 2 2-2c-0.5-0.5-1.2-0.8-2-0.8s-1.5 0.3-2 0.8z"/>
            </svg>
            <svg class="battery" viewBox="0 0 25 11" aria-hidden>
              <rect x="0.5" y="0.5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity="0.45"/>
              <rect x="22" y="3.5" width="1.5" height="4" rx="0.4" fill="currentColor" fill-opacity="0.45"/>
              <rect x="2" y="2" width="18" height="7" rx="1.4"/>
            </svg>
          </span>
        </div>

        <!-- Content -->
        <main class="content" data-od-id="content">
          <div class="header" data-od-id="header">
            <div style="display: flex; align-items: center; gap: 12px;">
              <button class="icon-btn" aria-label="Retour">
                <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
              </button>
              <div>
                <p class="greeting">Transaction</p>
                <h1 style="font-size: 20px;">TXN-20260501-0042</h1>
              </div>
            </div>
          </div>

          <!-- Status -->
          <section class="pad" style="margin-bottom: 8px;">
            <div class="card row-between" style="padding: 14px 16px;">
              <div class="row" style="gap: 8px;">
                <span class="meta">1 mai 2026 · 14:32</span>
              </div>
              <div class="row" style="gap: 6px;">
                <span class="status-chip cash">Cash</span>
                <span class="status-chip synced">Sync</span>
              </div>
            </div>
          </section>

          <!-- Farmer -->
          <section class="pad" style="margin-bottom: 8px;">
            <div class="card row" style="gap: 12px; padding: 14px 16px;">
              <div style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-soft), var(--fg-soft)); border: 1px solid var(--border); display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--accent); flex-shrink: 0;">KJ</div>
              <div style="flex: 1;">
                <div style="font-size: 15px; font-weight: 500;">Kouassi Jean</div>
                <div style="color: var(--muted); font-size: 13px;">Carte FM-2847</div>
              </div>
            </div>
          </section>

          <!-- Items -->
          <section class="pad stack" style="gap: 0;">
            <div class="card flat row-between" style="padding: 14px 0;">
              <div>
                <div style="font-size: 15px; font-weight: 500;">Bananes plantain</div>
                <div style="color: var(--muted); font-size: 13px; margin-top: 2px;">2 × <span class="num">350</span> FCFA</div>
              </div>
              <span class="num" style="font-size: 16px; font-weight: 600;">700 FCFA</span>
            </div>
            <div class="card flat row-between" style="padding: 14px 0;">
              <div>
                <div style="font-size: 15px; font-weight: 500;">Igname</div>
                <div style="color: var(--muted); font-size: 13px; margin-top: 2px;">5 × <span class="num">200</span> FCFA</div>
              </div>
              <span class="num" style="font-size: 16px; font-weight: 600;">1 000 FCFA</span>
            </div>
            <div class="card flat row-between" style="padding: 14px 0;">
              <div>
                <div style="font-size: 15px; font-weight: 500;">Huile de palme</div>
                <div style="color: var(--muted); font-size: 13px; margin-top: 2px;">1 × <span class="num">1 500</span> FCFA</div>
              </div>
              <span class="num" style="font-size: 16px; font-weight: 600;">1 500 FCFA</span>
            </div>
          </section>

          <!-- Totals -->
          <section class="pad" style="margin-top: 8px;">
            <div class="card" style="padding: 18px;">
              <div class="row-between" style="margin-bottom: 10px;">
                <span style="color: var(--muted); font-size: 14px;">Sous-total</span>
                <span class="num" style="font-size: 15px;">3 200 FCFA</span>
              </div>
              <div class="row-between" style="padding-top: 12px; border-top: 1px solid var(--border);">
                <span style="font-weight: 600; font-size: 16px;">Total</span>
                <span class="num total-accent">3 200 FCFA</span>
              </div>
            </div>
          </section>
        </main>

        <!-- No tab bar -->
        <div class="home-indicator" aria-hidden></div>
      </div>
    </div>
  </div>
</body>
</html>
